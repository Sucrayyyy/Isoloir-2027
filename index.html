<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Isoloir 2027</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Choisis des idées, pas des noms. Découvre à l'aveugle le programme présidentiel 2027 le plus proche de tes convictions.">
<meta name="theme-color" content="#EEF0F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#07080F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Isoloir">
<meta property="og:title" content="Isoloir 2027">
<meta property="og:description" content="Choisis des idées, pas des noms. Quel programme présidentiel te ressemble vraiment ?">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Layout : une colonne d'app iPhone (max 560px), barre flottante en verre, cartes en verre dépoli
   posées sur un fond de lumières pastel neutres (aucune couleur de parti). */
:root{
  --bg:#EEF0F6; --ink:#0F1222; --muted:#4B5068; --faint:#7A7F96;
  --glass:rgba(255,255,255,.58); --glass-hi:rgba(255,255,255,.82); --glass-border:rgba(255,255,255,.75);
  --hair:rgba(15,18,34,.09); --spec:rgba(255,255,255,.9); --shade:rgba(31,38,92,.18);
  --accent:#4C47E0; --accent-soft:rgba(76,71,224,.12); --on-accent:#FFFFFF;
  --yes:#0E8A5C; --yes-tint:rgba(14,138,92,.14); --no:#C7362B; --no-tint:rgba(199,54,43,.12);
  --b1:#C9C2FF; --b2:#B4E1FF; --b3:#FFD6C4; --b4:#C6F0DF; --blob-op:.85;
  --solid:#0F1222; --on-solid:#FFFFFF;
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;
  --f-num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --r-l:28px; --r-m:20px; --r-s:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#07080F; --ink:#F2F3F8; --muted:#B0B5CA; --faint:#868BA3;
  --glass:rgba(255,255,255,.075); --glass-hi:rgba(255,255,255,.13); --glass-border:rgba(255,255,255,.16);
  --hair:rgba(255,255,255,.1); --spec:rgba(255,255,255,.22); --shade:rgba(0,0,0,.55);
  --accent:#9C98FF; --accent-soft:rgba(156,152,255,.16); --on-accent:#0B0C18;
  --yes:#41D69C; --yes-tint:rgba(65,214,156,.16); --no:#FF7D72; --no-tint:rgba(255,125,114,.15);
  --b1:#3E3393; --b2:#0E4D70; --b3:#6E2C3B; --b4:#12584A; --blob-op:.75;
  --solid:#F2F3F8; --on-solid:#0B0C18; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#07080F; --ink:#F2F3F8; --muted:#B0B5CA; --faint:#868BA3;
  --glass:rgba(255,255,255,.075); --glass-hi:rgba(255,255,255,.13); --glass-border:rgba(255,255,255,.16);
  --hair:rgba(255,255,255,.1); --spec:rgba(255,255,255,.22); --shade:rgba(0,0,0,.55);
  --accent:#9C98FF; --accent-soft:rgba(156,152,255,.16); --on-accent:#0B0C18;
  --yes:#41D69C; --yes-tint:rgba(65,214,156,.16); --no:#FF7D72; --no-tint:rgba(255,125,114,.15);
  --b1:#3E3393; --b2:#0E4D70; --b3:#6E2C3B; --b4:#12584A; --blob-op:.75;
  --solid:#F2F3F8; --on-solid:#0B0C18; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:17px;line-height:1.55;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 70%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px)}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:12px}

/* Fond lumineux */
.sky{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.sky i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(70px);opacity:var(--blob-op);animation:float 26s ease-in-out infinite alternate}
.sky i:nth-child(1){background:var(--b1);left:-22vmax;top:-18vmax}
.sky i:nth-child(2){background:var(--b2);right:-24vmax;top:8vmax;animation-delay:-6s}
.sky i:nth-child(3){background:var(--b3);left:-14vmax;bottom:-26vmax;animation-delay:-12s}
.sky i:nth-child(4){background:var(--b4);right:-18vmax;bottom:-20vmax;animation-delay:-18s;width:48vmax;height:48vmax}
@keyframes float{from{transform:translate(0,0) scale(1)}to{transform:translate(6vmax,5vmax) scale(1.12)}}

/* Verre */
.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  border:1px solid var(--glass-border);border-radius:var(--r-l);
  box-shadow:inset 0 1px 0 var(--spec),inset 0 -1px 0 rgba(255,255,255,.08),0 18px 40px -22px var(--shade)}
.glass.hi{background:var(--glass-hi)}

.app{position:relative;z-index:1;max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:env(safe-area-inset-top,0px) calc(120px + env(safe-area-inset-bottom,0px))}
.bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:5;margin-top:8px;display:flex;align-items:center;gap:10px;
  padding:8px 8px 8px 16px;border-radius:999px}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;cursor:pointer;font-weight:750;font-size:18px;letter-spacing:-.01em}
.brand svg{width:22px;height:22px}
.bar .spacer{flex:1}
.pill{border:0;border-radius:999px;padding:9px 16px;font-size:15px;font-weight:600;cursor:pointer;background:var(--accent-soft);color:var(--accent)}

main{display:block}
.screen{display:flex;flex-direction:column;gap:22px;padding-top:26px;animation:in .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.eyebrow{font-size:13px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.025em}
h1{font-size:clamp(38px,11vw,52px);line-height:1.04;font-weight:800}
h2{font-size:30px;line-height:1.1;font-weight:780}
h3{font-size:20px;line-height:1.25;font-weight:700;letter-spacing:-.015em}
p{margin:0}
.lead{font-size:19px;line-height:1.5;color:var(--muted);max-width:32ch}
.small{font-size:15px;color:var(--muted);line-height:1.5}
.tiny{font-size:13px;color:var(--faint)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}

.chip-info{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;font-size:14px;font-weight:650}
.chip-info b{font-family:var(--f-num);font-size:16px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:var(--r-m);min-height:56px;padding:14px 18px;
  font-weight:700;font-size:17px;cursor:pointer;background:var(--solid);color:var(--on-solid);text-decoration:none;transition:transform .15s,opacity .15s;text-align:center}
.btn:active{transform:scale(.97)}
.btn.glass{background:var(--glass);color:var(--ink)}
.btn.accent{background:var(--accent);color:var(--on-accent)}
.btn[disabled]{opacity:.4;pointer-events:none}

.mode{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 14px;width:100%;text-align:left;padding:22px;cursor:pointer;border-radius:var(--r-l);transition:transform .15s}
.mode:active{transform:scale(.98)}
.mode b{font-family:var(--f-display);font-size:21px;font-weight:750;letter-spacing:-.02em}
.mode span{grid-column:1;font-size:15px;color:var(--muted);line-height:1.4}
.mode em{grid-row:1/3;grid-column:2;font-style:normal;text-align:right;font-size:13px;color:var(--faint);font-weight:600;line-height:1.3}
.mode em strong{display:block;font-family:var(--f-num);font-size:26px;color:var(--ink);font-weight:750}
.mode.main{background:var(--solid);color:var(--on-solid);border-color:transparent}
.mode.main span,.mode.main em{color:color-mix(in srgb,var(--on-solid) 72%,transparent)}
.mode.main em strong{color:var(--on-solid)}

.banner{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:var(--r-m);cursor:pointer;text-align:left;width:100%;border:1px solid var(--glass-border)}
.banner div{flex:1;min-width:0}
.banner b{display:block;font-size:16px}
.banner span{font-size:14px;color:var(--muted)}
.banner .go{font-weight:700;color:var(--accent);font-size:15px}

.how{padding:22px;display:flex;flex-direction:column;gap:16px}
.how ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px;counter-reset:s}
.how li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;counter-increment:s;font-size:16px;line-height:1.45}
.how li::before{content:counter(s);font-family:var(--f-num);font-weight:750;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:15px}
.foot{font-size:14px;color:var(--faint);text-align:center;line-height:1.5;padding:0 8px}
.linkbtn{background:none;border:0;padding:4px 2px;color:var(--accent);font-size:15px;font-weight:600;cursor:pointer}
.linkbtn.muted{color:var(--muted)}
.linkbtn:disabled{opacity:.3;cursor:default}

/* Priorités */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1px solid var(--glass-border);background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-radius:999px;
  padding:12px 16px;font-size:16px;font-weight:600;cursor:pointer;transition:transform .12s}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--solid);color:var(--on-solid);border-color:transparent}

/* Carte */
.progress{display:flex;align-items:center;gap:14px}
.track{flex:1;height:6px;background:var(--hair);border-radius:6px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.count{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:15px;font-weight:700;color:var(--muted);min-width:54px;text-align:right}
.deck{position:relative;display:grid;touch-action:pan-y;min-height:330px}
.ballot{grid-area:1/1;padding:28px 24px 22px;display:flex;flex-direction:column;gap:18px;user-select:none;-webkit-user-select:none;
  will-change:transform;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .28s;touch-action:pan-y}
.ballot.under{transform:translateY(14px) scale(.94);opacity:.55;pointer-events:none}
.tag{align-self:flex-start;font-size:14px;font-weight:650;color:var(--accent);background:var(--accent-soft);padding:6px 12px;border-radius:999px}
.ballot .q{font-family:var(--f-display);font-weight:700;font-size:clamp(25px,7vw,30px);line-height:1.22;letter-spacing:-.02em;text-wrap:pretty;flex:1}
.help-btn{align-self:flex-start;background:none;border:0;padding:0;color:var(--accent);font-weight:650;font-size:15px;cursor:pointer;display:flex;align-items:center;gap:6px}
.help-btn::before{content:"?";width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;font-size:13px;font-weight:800}
.more{display:flex;flex-direction:column;gap:12px;background:var(--accent-soft);border-radius:var(--r-m);padding:16px}
.more div{display:flex;flex-direction:column;gap:3px}
.more b{font-size:13px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.more b.p{color:var(--yes)} .more b.n{color:var(--no)}
.more p{font-size:16px;line-height:1.5;color:var(--ink)}
.args{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.args li{display:grid;grid-template-columns:12px 1fr;gap:8px;font-size:16px;line-height:1.45;color:var(--ink)}
.args li::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.45;margin-top:9px}
.more .src{font-size:13px;color:var(--faint)}
.plist{list-style:none;margin:0;padding:0}
.plist li+li{border-top:1px solid var(--hair)}
.plist button{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;width:100%;background:none;border:0;padding:16px 0;text-align:left;cursor:pointer}
.plist b{font-size:17px}
.new{display:inline-block;vertical-align:2px;margin-left:6px;font-size:11px;font-weight:750;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:999px}
.plist span{grid-column:1;font-size:14px;color:var(--muted)}
.plist i{grid-row:1/3;grid-column:2;font-style:normal;color:var(--accent);font-weight:700;font-size:20px}
.theme-sec{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.theme-sec .simple{font-size:17px;line-height:1.5;font-weight:550}
.theme-sec .none{color:var(--faint);font-style:italic}
.gl{padding:6px 20px}
.gl div{padding:14px 0;display:flex;flex-direction:column;gap:4px}
.gl div+div{border-top:1px solid var(--hair)}
.gl b{font-size:17px}
.gl p{font-size:16px;color:var(--muted);line-height:1.5}
.stamp{position:absolute;top:22px;padding:6px 12px;border:3px solid;border-radius:12px;font-weight:850;font-size:18px;letter-spacing:.02em;text-transform:uppercase;opacity:0;pointer-events:none;background:var(--glass-hi)}
.stamp.yes{right:18px;color:var(--yes);transform:rotate(-8deg)}
.stamp.no{left:18px;color:var(--no);transform:rotate(8deg)}
.hint{text-align:center;font-size:14px;color:var(--faint)}
.weight{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:600;cursor:pointer;color:var(--muted);background:none;border:0;padding:4px 2px;align-self:flex-start}
.weight .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--hair);display:grid;place-items:center;background:var(--glass)}
.weight[aria-pressed="true"]{color:var(--ink)}
.weight[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.weight[aria-pressed="true"] .box::after{content:"";width:7px;height:12px;border:solid var(--on-accent);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.vote{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vote button{border:1px solid var(--glass-border);border-radius:var(--r-m);min-height:64px;font-weight:750;font-size:18px;cursor:pointer;transition:transform .12s;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.vote button:active{transform:scale(.96)}
.vote .no{background:var(--no-tint);color:var(--no)}
.vote .sno{background:color-mix(in srgb,var(--no-tint) 55%,var(--glass));color:var(--no);font-weight:650}
.vote .syes{background:color-mix(in srgb,var(--yes-tint) 55%,var(--glass));color:var(--yes);font-weight:650}
.vote .yes{background:var(--yes-tint);color:var(--yes)}
.vote .skip{grid-column:1/3;min-height:50px;background:var(--glass);color:var(--muted);font-size:16px;font-weight:650}
.under-actions{display:flex;justify-content:space-between;align-items:center}

/* Dépouillement */
.counting{min-height:62vh;display:grid;place-items:center;text-align:center}
.urn{width:120px;height:120px;position:relative;margin:0 auto 8px}
.urn .body{position:absolute;inset:46px 12px 0;border-radius:18px}
.urn .slot{position:absolute;left:40px;right:40px;top:44px;height:6px;border-radius:3px;background:var(--ink);opacity:.8}
.urn .paper{position:absolute;left:46px;width:28px;height:40px;border-radius:4px;background:var(--glass-hi);border:1.5px solid var(--ink);top:0;animation:drop 1.1s ease-in infinite}
@keyframes drop{0%{transform:translateY(-8px);opacity:0}25%{opacity:1}80%{transform:translateY(42px);opacity:1}100%{transform:translateY(48px);opacity:0}}

/* Résultat */
.hero{padding:30px 22px 26px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;animation:pop .6s cubic-bezier(.2,.9,.25,1.15) both}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(16px)}to{opacity:1;transform:none}}
.hero .who{font-family:var(--f-display);font-size:clamp(32px,9.5vw,42px);font-weight:820;letter-spacing:-.03em;line-height:1.05;margin-top:6px;text-wrap:balance}
.hero .party{font-size:17px;font-weight:600;color:var(--muted)}
.fam{display:inline-block;font-size:13px;font-weight:650;padding:5px 11px;border-radius:999px;background:var(--hair);color:var(--muted)}
.big{font-family:var(--f-num);font-weight:800;font-size:76px;line-height:1;letter-spacing:-.03em;margin-top:14px;font-variant-numeric:tabular-nums;color:var(--accent)}
.big small{font-size:34px}
.hero .lbl{font-size:15px;font-weight:600;color:var(--muted)}
.podium{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.podium button{padding:16px;text-align:left;display:flex;flex-direction:column;gap:2px;cursor:pointer;border-radius:var(--r-m)}
.podium .pl{font-size:13px;font-weight:650;color:var(--faint)}
.podium .pn{font-weight:700;font-size:16px;line-height:1.25}
.podium .pv{font-family:var(--f-num);font-weight:780;font-size:24px;margin-top:4px}
.share-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.share-row .wide{grid-column:1/3}
.note{padding:16px 18px;border-radius:var(--r-m);font-size:15px;line-height:1.5;color:var(--muted)}
.duo{padding:20px;display:flex;flex-direction:column;gap:10px}
.duo .big{font-size:56px;margin:0}

.seg{display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border-radius:999px;gap:4px}
.seg button{border:0;background:transparent;border-radius:999px;padding:11px 6px;font-weight:650;font-size:15px;cursor:pointer;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--glass-hi);color:var(--ink);box-shadow:0 2px 10px -4px var(--shade)}
.board{padding:6px 18px}
.rank{list-style:none;margin:0;padding:0}
.rank li+li{border-top:1px solid var(--hair)}
.rank button,.rank .rowi{display:grid;grid-template-columns:30px 1fr auto;gap:6px 12px;align-items:center;width:100%;background:none;border:0;padding:16px 0;text-align:left;cursor:pointer}
.rank .n{font-family:var(--f-num);font-weight:750;color:var(--faint);font-size:16px}
.rank .nm{font-weight:700;font-size:17px;line-height:1.3;min-width:0}
.rank .nm small{display:block;font-weight:500;color:var(--muted);font-size:14px;margin-top:1px}
.rank .v{font-family:var(--f-num);font-weight:780;font-size:21px;font-variant-numeric:tabular-nums}
.meter{grid-column:2/4;height:7px;background:var(--hair);border-radius:7px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:7px;background:var(--ink);opacity:.75}
.rank li:first-child .meter i{background:var(--accent);opacity:1}
.spectrum{padding:18px;display:flex;flex-direction:column;gap:12px}
.spec-bar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;height:46px}
.spec-bar span{border-radius:10px;background:var(--accent);position:relative}
.spec-ends{display:flex;justify-content:space-between;font-size:13px;font-weight:650;color:var(--faint)}

/* Détail */
.panel{padding:20px;display:flex;flex-direction:column;gap:14px}
.thm{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;font-size:16px}
.thm b{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.thm .meter{grid-column:1/3}
.thm .meter i{background:var(--accent);opacity:1}
.idea{display:grid;grid-template-columns:16px 1fr;gap:12px;font-size:16px;line-height:1.45}
.dot{width:10px;height:10px;border-radius:50%;margin-top:7px}
.dot.ok{background:var(--yes)} .dot.ko{background:var(--no)}
.bul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.bul li{display:grid;grid-template-columns:14px 1fr;gap:10px;font-size:16px;line-height:1.45}
.bul li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:9px}

/* Aveugle */
.prog{padding:22px 20px;display:flex;flex-direction:column;gap:16px}
.prog .head{display:flex;align-items:center;gap:12px}
.letter{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-num);font-weight:800;font-size:24px;background:var(--solid);color:var(--on-solid)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{border:1px solid var(--glass-border);background:var(--glass);border-radius:var(--r-s);min-height:50px;font-weight:700;font-size:16px;cursor:pointer;color:var(--muted)}
.rate button[aria-pressed="true"].r-1{background:var(--no-tint);color:var(--no);border-color:var(--no)}
.rate button[aria-pressed="true"].r0{background:var(--hair);color:var(--ink);border-color:var(--ink)}
.rate.five{grid-template-columns:1fr 1.25fr .6fr 1.25fr 1fr;gap:6px}
.rate.five button{font-size:13px;padding:6px 2px;line-height:1.2}
.rate button[aria-pressed="true"].r-0\.5{background:var(--no-tint);color:var(--no);border-color:var(--no)}
.rate button[aria-pressed="true"].r0\.5{background:var(--yes-tint);color:var(--yes);border-color:var(--yes)}
.rate button[aria-pressed="true"].r1{background:var(--yes-tint);color:var(--yes);border-color:var(--yes)}
.sticky-cta{position:sticky;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:4;padding:10px;border-radius:calc(var(--r-m) + 8px)}

/* Infos */
.cal{padding:6px 20px}
.cal li{display:grid;grid-template-columns:86px 1fr;gap:14px;padding:16px 0;align-items:baseline}
.cal li+li{border-top:1px solid var(--hair)}
.cal .d{font-family:var(--f-num);font-weight:780;font-size:19px}
.prose{display:flex;flex-direction:column;gap:12px;font-size:16px;line-height:1.6}
.prose h3{margin-top:10px}

/* Barre d'onglets */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:8;
  width:calc(100% - 2*max(10px,env(safe-area-inset-left,0px)));max-width:528px;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:0;padding:5px;border-radius:999px}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:999px;
  font-size:11px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;font-weight:650;color:var(--muted);cursor:pointer;transition:background .2s,color .2s,transform .12s;min-width:0}
.tabbar button:active{transform:scale(.94)}
.tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{background:var(--glass-hi);color:var(--accent);box-shadow:0 2px 10px -4px var(--shade)}
.tabbar button:disabled{opacity:.32;cursor:default}
.tabbar.test button.primary{color:var(--accent)}
.tabbar.main{grid-auto-flow:row;grid-template-columns:.95fr 1.35fr 1.1fr 1.05fr .85fr}

/* Comparateur et réponses */
.sel{-webkit-appearance:none;appearance:none;width:100%;padding:14px 38px 14px 16px;border-radius:var(--r-s);border:1px solid var(--glass-border);background:var(--glass-hi);
  font:inherit;font-weight:650;font-size:16px;color:var(--ink);background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 20px) 52%,calc(100% - 14px) 52%;background-size:6px 6px;background-repeat:no-repeat}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.vs span{font-weight:750;color:var(--faint);font-size:14px}
.toggle{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;color:var(--muted);background:none;border:0;padding:4px 0;cursor:pointer;align-self:flex-start}
.toggle i{width:44px;height:26px;border-radius:999px;background:var(--hair);position:relative;transition:background .2s}
.toggle i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.toggle[aria-pressed="true"]{color:var(--ink)}
.toggle[aria-pressed="true"] i{background:var(--accent)}
.toggle[aria-pressed="true"] i::after{transform:translateX(18px)}
.cmp{display:flex;flex-direction:column;gap:12px;padding:16px 0}
.cmp+.cmp{border-top:1px solid var(--hair)}
.cmp p{font-size:16px;line-height:1.45;font-weight:600}
.cmp .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pos{display:flex;flex-direction:column;gap:1px;padding:8px 10px;border-radius:12px;font-size:14px;font-weight:700;background:var(--hair);color:var(--muted);min-width:0}
.pos small{font-weight:550;font-size:12px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos.p{background:var(--yes-tint);color:var(--yes)} .pos.n{background:var(--no-tint);color:var(--no)}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum div{padding:16px;border-radius:var(--r-m);text-align:center}
.sum b{display:block;font-family:var(--f-num);font-size:34px;font-weight:800;line-height:1.1}
.sum span{font-size:14px;color:var(--muted)}
.rv{display:flex;flex-direction:column;gap:12px;padding:16px 0}
.rv+.rv{border-top:1px solid var(--hair)}
.rv p{font-size:16px;line-height:1.45}

/* Modale */
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  background:rgba(7,8,15,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.modal .sheet{width:100%;max-width:420px;padding:18px;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow:auto}
.modal img{width:100%;border-radius:18px;display:block;aspect-ratio:9/16;object-fit:cover;max-height:58vh;object-fit:contain}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;padding:13px 20px;border-radius:999px;
  font-weight:650;font-size:15px;background:var(--solid);color:var(--on-solid);box-shadow:0 12px 30px -10px var(--shade);max-width:calc(100% - 36px);text-align:center}
</style>
</head>
<body>

<div class="sky" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="app">
  <header class="bar glass">
    <button class="brand" id="home-btn" aria-label="Accueil">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="10" width="18" height="11" rx="3" stroke="currentColor" stroke-width="2"/><rect x="8" y="3" width="8" height="10" rx="1.5" fill="var(--accent)"/><path d="M7 10h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Isoloir
    </button>
    <span class="spacer"></span>
    <button class="pill" id="info-btn" aria-label="Calendrier et infos pratiques">Infos</button>
  </header>
  <main id="view"></main>
</div>
<nav class="tabbar glass" id="tabbar" aria-label="Navigation"></nav>
<div class="toast" id="toast" hidden></div>
<div class="modal" id="modal" hidden></div>

<script src="data.js?v=7"></script>
<script src="progs.js?v=7"></script>
<script>
(function(){
const T=window.ISO_THEMES, C=window.ISO_CANDIDATES, S=window.ISO_STATEMENTS, P=window.ISO_PROGRAMMES, F=window.ISO_FAMILIES;
const byId=Object.fromEntries(C.map(c=>[c.id,c])), famById=Object.fromEntries(F.map(f=>[f.id,f])), sById=Object.fromEntries(S.map(s=>[s.id,s]));
const view=document.getElementById('view');
const store={ get(k){try{return JSON.parse(localStorage.getItem('iso27:'+k))}catch(e){return null}}, set(k,v){try{localStorage.setItem('iso27:'+k,JSON.stringify(v))}catch(e){}}, del(k){try{localStorage.removeItem('iso27:'+k)}catch(e){}} };
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const LET="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const NC=C.length;
const CORE=S.filter(s=>s.core).length;
const BASE=location.href.split('#')[0];
const isPages=/github\.io$/.test(location.hostname);

let state=null;
let friend=null;

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}
function go(html){view.innerHTML='<section class="screen">'+html+'</section>';window.scrollTo(0,0)}
function haptic(){try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}}
function daysLeft(){const d=new Date(window.ISO_ROUND1+'T08:00:00');return Math.max(0,Math.ceil((d-new Date())/864e5))}

/* ----- Défi entre amis : réponses encodées dans le lien ----- */
const ENC={'1':'A','0.5':'a','-0.5':'b','-1':'B'},DEC={A:1,a:.5,b:-.5,B:-1};
function encode(ans){let s=S.map(x=>ENC[String(ans[x.id])]||'0').join('');return s.replace(/0+$/,'')}
function decode(code){const a={};[...code].forEach((ch,i)=>{if(S[i]&&DEC[ch])a[S[i].id]=DEC[ch]});return a}
function readHash(){
  const m=location.hash.match(/^#d=([aAbB0]{1,200})\.([a-z]{1,4})$/);
  if(m&&byId[m[2]]){friend={answers:decode(m[1]),top:m[2]};store.set('friend',friend);history.replaceState(null,'',BASE)}
  else friend=store.get('friend');
}

/* ----- Accueil ----- */
function home(){nav('main','home');
  const last=store.get('last'), prog=store.get('progress'), d=daysLeft();
  go(`
    <span class="eyebrow">Présidentielle · 18 avril et 2 mai 2027</span>
    <div class="stack" style="gap:14px">
      <h1>Choisis des idées, pas des noms.</h1>
      <p class="lead">Lis de vraies propositions de candidats, sans savoir de qui elles viennent. À la fin, on lève le rideau.</p>
    </div>
    ${friend?`<button class="banner glass" data-go="express"><div><b>Un ami t'a lancé un défi</b><span>Fais le test pour voir si vous pensez pareil.</span></div><span class="go">Relever</span></button>`:''}
    ${prog?`<button class="banner glass" data-go="resume"><div><b>Reprendre ton test</b><span>Idée ${prog.i+1} sur ${prog.ids.length}</span></div><span class="go">Continuer</span></button>`:''}
    <div class="stack">
      <button class="mode main" data-go="express"><b>Test express</b><span>Les idées qui départagent le plus les candidats</span><em><strong>${CORE}</strong>idées · 4 min</em></button>
      <button class="mode glass" data-go="full"><b>Test complet</b><span>Toutes les propositions, pour un résultat plus précis</span><em><strong>${S.length}</strong>idées · 10 min</em></button>
      <button class="mode glass" data-go="theme"><b>Test par thème</b><span>Choisis les sujets qui t'intéressent : retraites, écologie, école…</span><em><strong>10</strong>thèmes</em></button>
      <button class="mode glass" data-go="blind"><b>Programmes à l'aveugle</b><span>Lis ${NC} programmes résumés, note-les, découvre qui est qui</span><em><strong>${NC}</strong>programmes</em></button>
    </div>
    ${last?`<button class="banner glass" data-go="last"><div><b>Ton dernier résultat</b><span>${esc(byId[last.top]?.name||'')}</span></div><span class="go">Revoir</span></button>`:''}
    <div class="how glass">
      <h3>Comment ça marche</h3>
      <ol>
        <li>Une question s'affiche, sans nom ni parti. Réponds de « Non » à « Oui », avec des nuances. Un doute ? « En savoir plus » t'explique la situation, ce que ça changerait et les arguments des deux camps.</li>
        <li>Coche « Important pour moi » sur les sujets qui comptent : ils pèsent double.</li>
        <li>On compare tes réponses aux positions des ${NC} candidats et on révèle ton classement.</li>
      </ol>
    </div>
    <p class="foot">Outil indépendant et neutre. Positions à jour au ${window.ISO_UPDATED}.<br>Tes réponses restent sur ton téléphone. <button class="linkbtn" data-go="method">Voir la méthode</button></p>
  `);
}

/* ----- Priorités ----- */
function priorities(mode){nav('main','home');
  const th=mode==='theme';
  go(`
    <div class="stack" style="gap:12px">
      <span class="eyebrow">${th?'Test par thème':'Avant de commencer'}</span>
      <h2>${th?'Quels sujets veux-tu explorer ?':"Qu'est-ce qui compte le plus pour toi ?"}</h2>
      <p class="small">${th?'Choisis un ou plusieurs thèmes. Tu répondras à toutes les questions de ces thèmes, et seulement à celles-là.':'Choisis jusqu\'à 3 sujets. Ils compteront un peu plus dans ton résultat. Tu peux aussi passer cette étape.'}</p>
    </div>
    <div class="chips">${Object.entries(T).map(([k,v])=>`<button class="chip" aria-pressed="false" data-k="${k}">${esc(v)}</button>`).join('')}</div>
    <button class="btn accent" id="start" style="margin-top:8px">C'est parti</button>
  `);
  view.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const on=b.getAttribute('aria-pressed')==='true';
    if(!th&&!on&&view.querySelectorAll('.chip[aria-pressed="true"]').length>=3){toast('3 sujets maximum');return}
    b.setAttribute('aria-pressed',String(!on));haptic()});
  document.getElementById('start').onclick=()=>{
    const pr=[...view.querySelectorAll('.chip[aria-pressed="true"]')].map(b=>b.dataset.k);
    if(th&&!pr.length){toast('Choisis au moins un thème');return}
    const pool=mode==='express'?S.filter(s=>s.core):th?S.filter(s=>pr.includes(s.t)):S;
    const ids=shuffle(Object.keys(T)).flatMap(t=>shuffle(pool.filter(s=>s.t===t)).map(s=>s.id));
    state={mode,ids,i:0,answers:{},important:{},priorities:th?[]:pr};save();card();
  };
}
function save(){store.set('progress',state)}

/* ----- Carte ----- */
function card(){
  if(state.i>=state.ids.length)return counting();
  const s=sById[state.ids[state.i]], nx=sById[state.ids[state.i+1]], n=state.ids.length;
  go(`
    <div class="progress"><div class="track"><i style="width:${(state.i/n*100).toFixed(1)}%"></i></div><span class="count">${state.i+1}/${n}</span></div>
    <div class="deck">
      ${nx?`<div class="ballot glass under" aria-hidden="true"></div>`:''}
      <article class="ballot glass hi" id="ballot">
        <span class="stamp yes">Plutôt oui</span><span class="stamp no">Plutôt non</span>
        <span class="tag">${esc(T[s.t])}</span>
        <div class="q">${esc(s.text)}</div>
        <button class="help-btn" id="hb">En savoir plus</button>
        <div class="more" id="ht" hidden>
          <div><b>La situation aujourd'hui</b><p>${esc(s.ctx)}</p></div>
          <div><b>Concrètement, ça changerait quoi ?</b><p>${esc(s.concret)}</p></div>
          <div><b class="p">Ceux qui sont pour disent</b><ul class="args">${s.pour.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
          <div><b class="n">Ceux qui sont contre disent</b><ul class="args">${s.contre.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
          <p class="src">Arguments résumés des deux camps, pas l'avis de l'app.</p>
        </div>
      </article>
    </div>
    ${state.i===0?'<p class="hint">Astuce : glisse la carte à droite pour « plutôt oui », à gauche pour « plutôt non ».</p>':''}
    <button class="weight" id="imp" aria-pressed="${state.important[s.id]?'true':'false'}"><span class="box"></span>Important pour moi</button>
    <div class="vote">
      <button class="no" data-v="-1">Non</button>
      <button class="yes" data-v="1">Oui</button>
      <button class="sno" data-v="-0.5">Plutôt non</button>
      <button class="syes" data-v="0.5">Plutôt oui</button>
      <button class="skip" data-v="0">Je ne sais pas</button>
    </div>
  `);
  const hb=document.getElementById('hb'); if(hb)hb.onclick=e=>{e.stopPropagation();const t=document.getElementById('ht');t.hidden=!t.hidden;hb.textContent=t.hidden?'En savoir plus':'Masquer'};
  document.getElementById('imp').onclick=e=>{const b=e.currentTarget,on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(on));state.important[s.id]=on;save();haptic()};
  view.querySelectorAll('.vote button').forEach(b=>b.onclick=()=>answer(+b.dataset.v));
  nav('test');
  swipe(document.getElementById('ballot'));
}
function answer(v){
  state.answers[state.ids[state.i]]=v; haptic();
  const b=document.getElementById('ballot');
  if(b){b.style.transform=v?`translateX(${Math.sign(v)*125}%) rotate(${Math.sign(v)*12}deg)`:'translateY(-40px) scale(.96)';b.style.opacity='0'}
  setTimeout(()=>{state.i++;save();card()},220);
}
function swipe(el){
  let x0=null,y0=0,dx=0,id=null,drag=false;const yes=el.querySelector('.stamp.yes'),no=el.querySelector('.stamp.no');
  el.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;x0=e.clientX;y0=e.clientY;dx=0;id=e.pointerId;drag=false});
  el.addEventListener('pointermove',e=>{if(x0===null||e.pointerId!==id)return;dx=e.clientX-x0;const dy=e.clientY-y0;
    if(!drag){if(Math.abs(dx)<10)return;if(Math.abs(dy)>Math.abs(dx)){x0=null;return}drag=true;el.style.transition='none';try{el.setPointerCapture(id)}catch(_){}}
    el.style.transform=`translateX(${dx}px) rotate(${dx/20}deg)`;yes.style.opacity=Math.max(0,Math.min(1,dx/90));no.style.opacity=Math.max(0,Math.min(1,-dx/90))});
  const end=()=>{if(x0===null)return;x0=null;if(!drag)return;el.style.transition='';
    if(dx>90)return answer(0.5);if(dx<-90)return answer(-0.5);el.style.transform='';yes.style.opacity=0;no.style.opacity=0};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}

/* ----- Calcul ----- */
function compute(answers,important,prios){
  return C.map(c=>{
    let sc=0,max=0,n=0;const th={},agree=[],disagree=[];
    for(const s of S){const u=answers[s.id],p=s.pos[c.id];if(!u||p===undefined)continue;
      const w=(important[s.id]?2:1)*(prios.includes(s.t)?1.5:1);sc+=w*u*p;max+=w*Math.abs(p);n++;
      th[s.t]=th[s.t]||{sc:0,max:0};th[s.t].sc+=w*u*p;th[s.t].max+=w*Math.abs(p);(u*p>0?agree:disagree).push(s.id)}
    return{id:c.id,pct:max>0&&n>=3?Math.round(50+50*sc/(max+4)):null,n,th,agree,disagree,r:Math.random()};
  }).sort((a,b)=>(b.pct??-1)-(a.pct??-1)||b.n-a.n||a.r-b.r);
}
function counting(){nav('none');
  const nAns=Object.values(state.answers).filter(v=>v).length;
  go(`<div class="counting"><div class="stack" style="align-items:center;gap:16px">
    <div class="urn" aria-hidden="true"><div class="body glass"></div><div class="slot"></div><div class="paper"></div></div>
    <h2>Dépouillement…</h2><p class="small">On compare tes ${nAns} réponses aux positions des ${NC} candidats.</p></div></div>`);
  const saved={answers:state.answers,important:state.important,priorities:state.priorities,at:Date.now()};
  saved.top=compute(saved.answers,saved.important,saved.priorities)[0].id;
  store.set('last',saved);store.del('progress');
  setTimeout(()=>results(saved),matchMedia('(prefers-reduced-motion: reduce)').matches?150:1700);
}

/* ----- Classements (candidats, partis, familles) ----- */
function famScores(list){
  return F.map(f=>{const m=list.filter(r=>byId[r.id].fam===f.id&&r.pct!==null);
    return{id:f.id,pct:m.length?Math.round(m.reduce((a,r)=>a+r.pct,0)/m.length):null,members:list.filter(r=>byId[r.id].fam===f.id).map(r=>r.id)}});
}
function boards(list,unit){
  const fams=famScores(list), famSorted=fams.slice().sort((a,b)=>(b.pct??-1)-(a.pct??-1));
  const onSpec=fams.filter(f=>!famById[f.id].off), valid=onSpec.map(f=>f.pct??0), mn=Math.min(...valid), mx=Math.max(...valid);
  const row=(k,main,sub,pct,attr)=>`<li><${attr?'button '+attr:'div class="rowi"'}><span class="n">${k}</span><span class="nm">${main}<small>${sub}</small></span><span class="v">${pct===null?'–':pct+'%'}</span><span class="meter"><i style="width:${pct??0}%"></i></span></${attr?'button':'div'}></li>`;
  return `
  <div class="seg glass" role="tablist">
    <button role="tab" aria-selected="true" data-tab="cand">Candidats</button>
    <button role="tab" aria-selected="false" data-tab="party">Partis</button>
    <button role="tab" aria-selected="false" data-tab="fam">Familles</button>
  </div>
  <div data-pane="cand" class="board glass"><ol class="rank">${list.map((r,k)=>row(k+1,esc(byId[r.id].name),esc(byId[r.id].party)+(unit?` · ${unit(r)}`:''),r.pct,`data-detail="${r.id}"`)).join('')}</ol></div>

/* ----- Image story ----- */
function drawStory(res){
  const W=1080,H=1920,cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
  const dark=matchMedia('(prefers-color-scheme: dark)').matches&&document.documentElement.dataset.theme!=='light';
  g.fillStyle=dark?'#07080F':'#EEF0F6';g.fillRect(0,0,W,H);
  const blobs=dark?[['#3E3393',150,260],['#0E4D70',980,700],['#6E2C3B',120,1700],['#12584A',950,1650]]:[['#C9C2FF',150,260],['#B4E1FF',980,700],['#FFD6C4',120,1700],['#C6F0DF',950,1650]];
  blobs.forEach(([col,x,y])=>{const gr=g.createRadialGradient(x,y,0,x,y,700);gr.addColorStop(0,col);gr.addColorStop(1,col+'00');g.fillStyle=gr;g.fillRect(0,0,W,H)});
  const ink=dark?'#F2F3F8':'#0F1222',muted=dark?'#B0B5CA':'#4B5068',acc=dark?'#9C98FF':'#4C47E0';
  const rr=(x,y,w,h,r)=>{g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()};
  const font=(w,s)=>`${w} ${s}px -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif`;
  g.textAlign='center';
  g.fillStyle=muted;g.font=font(700,40);g.fillText('ISOLOIR 2027',W/2,190);
  g.fillStyle=ink;g.font=font(800,74);g.fillText('Mon programme',W/2,330);g.fillText('le plus proche',W/2,420);
  rr(90,500,900,760,64);g.fillStyle=dark?'rgba(255,255,255,0.10)':'rgba(255,255,255,0.72)';g.fill();g.strokeStyle=dark?'rgba(255,255,255,0.2)':'rgba(255,255,255,0.95)';g.lineWidth=3;g.stroke();
  const c=byId[res[0].id];
  g.fillStyle=muted;g.font=font(650,38);g.fillText(famById[c.fam].name,W/2,600);
  let size=96;g.font=font(850,size);while(g.measureText(c.name).width>800&&size>56){size-=4;g.font=font(850,size)}
  g.fillStyle=ink;g.fillText(c.name,W/2,740);
  g.fillStyle=muted;g.font=font(600,42);g.fillText(c.party,W/2,810);
  g.fillStyle=acc;g.font=`800 220px ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif`;g.fillText(res[0].pct+'%',W/2,1090);
  g.fillStyle=muted;g.font=font(600,40);g.fillText('de proximité',W/2,1170);
  g.textAlign='left';
  res.slice(1,4).forEach((r,k)=>{const y=1340+k*120;rr(90,y,900,96,32);g.fillStyle=dark?'rgba(255,255,255,0.07)':'rgba(255,255,255,0.55)';g.fill();
    g.fillStyle=muted;g.font=font(750,38);g.fillText((k+2)+'',130,y+62);g.fillStyle=ink;g.font=font(700,40);g.fillText(byId[r.id].name,190,y+62);
    g.textAlign='right';g.font=font(800,42);g.fillText(r.pct+'%',950,y+64);g.textAlign='left'});
  g.textAlign='center';g.fillStyle=ink;g.font=font(750,44);g.fillText('Et toi ? Fais le test à l\'aveugle',W/2,1760);
  g.fillStyle=acc;g.font=font(650,38);g.fillText(isPages?location.host+location.pathname.replace(/index\.html$/,''):'sucrayyyy.github.io/Isoloir-2027',W/2,1825);
  return cv;
}
function storyModal(res){

  else if(k==='home')home();
  else if(k==='compare')compare();
  else if(k==='info')info();
  else if(k==='learn')learn();
  else if(k==='result'){const l=store.get('last');if(l)results(l);else{priorities('express');toast("Fais d'abord un test pour voir ton résultat")}}
});
document.addEventListener('keydown',e=>{if(!document.getElementById('ballot')||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='ArrowRight'){e.preventDefault();answer(e.shiftKey?1:0.5)}else if(e.key==='ArrowLeft'){e.preventDefault();answer(e.shiftKey?-1:-0.5)}
  else if(e.key==='ArrowDown'){e.preventDefault();answer(0)}else if(e.key==='Backspace'&&state.i>0){e.preventDefault();state.i--;save();card()}});
function countUp(el,to){if(!el||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const t0=performance.now(),d=900;
  const f=t=>{const k=Math.min(1,(t-t0)/d),v=Math.round(to*(1-Math.pow(1-k,3)));el.firstChild.nodeValue=v;if(k<1)requestAnimationFrame(f)};el.firstChild.nodeValue=0;requestAnimationFrame(f)}

/* ----- Comparer deux candidats ----- */
const POSLBL={'1':'Pour','0.5':'Plutôt pour','-0.5':'Plutôt contre','-1':'Contre'};
function compare(a,b,onlyDiff){
  nav('main','compare');
  const last=store.get('last');
  if(!a){const r=last?compute(last.answers,last.important||{},last.priorities||[]):null;a=r?r[0].id:'jlm';b=r?r[1].id:'mlp'}
  const opt=sel=>C.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.name)}</option>`).join('');
  const rows=S.filter(s=>s.pos[a]!==undefined||s.pos[b]!==undefined);
  const both=rows.filter(s=>s.pos[a]!==undefined&&s.pos[b]!==undefined);
  const same=both.filter(s=>Math.sign(s.pos[a])===Math.sign(s.pos[b])).length, diff=both.length-same;
  const shown=onlyDiff?both.filter(s=>Math.sign(s.pos[a])!==Math.sign(s.pos[b])):rows;
  const cell=(id,p)=>{const k=p===undefined?'u':p>0?'p':'n';return`<div class="pos ${k}"><small>${esc(byId[id].name.split(' ').slice(-1)[0])}</small>${p===undefined?'Pas de position connue':POSLBL[String(p)]}</div>`};
  const themes=Object.keys(T).filter(t=>shown.some(s=>s.t===t));
  go(`
    <div class="stack" style="gap:12px"><span class="eyebrow">Face-à-face</span><h2>Comparer deux candidats</h2>
      <p class="small">Choisis deux personnalités et regarde, idée par idée, où elles se rejoignent et où elles s'opposent.</p></div>
    <div class="vs"><select class="sel" id="ca" aria-label="Premier candidat">${opt(a)}</select><span>VS</span><select class="sel" id="cb" aria-label="Second candidat">${opt(b)}</select></div>
    <div class="sum"><div class="glass"><b>${same}</b><span>idées en commun</span></div><div class="glass"><b>${diff}</b><span>désaccords</span></div></div>
    <button class="toggle" id="od" aria-pressed="${!!onlyDiff}"><i></i>Afficher seulement les désaccords</button>
    ${themes.map(t=>`<div class="board glass"><h3 style="padding-top:16px">${esc(T[t])}</h3>${shown.filter(s=>s.t===t).map(s=>`<div class="cmp"><p>${esc(s.label)}</p><div class="two">${cell(a,s.pos[a])}${cell(b,s.pos[b])}</div></div>`).join('')}</div>`).join('')||'<p class="note glass">Aucun désaccord connu entre ces deux candidats sur les idées de l\'app.</p>'}
    <p class="tiny" style="padding:0 6px">« Pas de position connue » veut dire que le candidat ne s'est pas encore exprimé clairement sur ce point.</p>
  `);
  document.getElementById('ca').onchange=e=>compare(e.target.value,b,onlyDiff);
  document.getElementById('cb').onchange=e=>compare(a,e.target.value,onlyDiff);
  document.getElementById('od').onclick=()=>compare(a,b,!onlyDiff);
}

/* ----- Revoir ses réponses ----- */
function review(saved){
  nav('main','result');
  const ids=S.filter(s=>s.id in saved.answers);
  const lb=[[-1,'Non'],[-0.5,'Plutôt non'],[0,'?'],[0.5,'Plutôt oui'],[1,'Oui']];
  go(`
    <button class="linkbtn" id="bk" style="align-self:flex-start">Retour au résultat</button>
    <div class="stack" style="gap:12px"><span class="eyebrow">Mes réponses</span><h2>Tu as changé d'avis ?</h2>
      <p class="small">Modifie une réponse, ton classement se met à jour tout de suite.</p></div>
    ${Object.keys(T).filter(t=>ids.some(s=>s.t===t)).map(t=>`<div class="board glass"><h3 style="padding-top:16px">${esc(T[t])}</h3>${ids.filter(s=>s.t===t).map(s=>`<div class="rv"><p>${esc(s.text)}</p>
      <div class="rate five">${lb.map(([v,l])=>`<button class="r${v}" data-id="${s.id}" data-v="${v}" aria-pressed="${saved.answers[s.id]===v}">${l}</button>`).join('')}</div></div>`).join('')}</div>`).join('')}
    <button class="btn accent" id="bk2">Voir mon résultat mis à jour</button>
  `);
  view.querySelectorAll('.rate button').forEach(b=>b.onclick=()=>{saved.answers[b.dataset.id]=+b.dataset.v;haptic();
    b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
    saved.top=compute(saved.answers,saved.important||{},saved.priorities||[])[0].id;store.set('last',saved)});
  document.getElementById('bk').onclick=document.getElementById('bk2').onclick=()=>results(saved);
}

/* ----- Onglet Programmes : lire et apprendre ----- */
const lastName=n=>n.split(' ').slice(-1)[0];
const slug=n=>n.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z]+/g,'-').replace(/^-|-$/g,'');
function learn(tab){
  nav('main','learn');tab=tab||'cand';
  const sorted=C.slice().sort((a,b)=>a.party.localeCompare(b.party,'fr'));
  go(`
    <div class="stack" style="gap:12px"><span class="eyebrow">S'informer</span><h2>Les programmes des partis</h2>
      <p class="small">Choisis un parti et lis son programme thème par thème, en version simplifiée ou classique. Révise aussi les mots de la politique.</p></div>
    <div class="seg glass" role="tablist">
      <button role="tab" aria-selected="${tab==='cand'}" data-lt="cand">Partis</button>
      <button role="tab" aria-selected="${tab==='gl'}" data-lt="gl">Lexique</button>
      <button role="tab" aria-selected="${tab==='el'}" data-lt="el">L'élection</button>
    </div>
    ${tab==='cand'?`<div class="board glass"><ul class="plist">${sorted.map(c=>`<li><button data-prog="${c.id}"><b>${esc(c.party)}${window.ISO_PROGS[c.id].isNew?' <span class="new">Nouveau</span>':''}</b><span>${esc(c.name)} · ${esc(famById[c.fam].name)}</span><i aria-hidden="true">›</i></button></li>`).join('')}</ul></div>
      <p class="tiny" style="padding:0 6px">Classés par ordre alphabétique.</p>`:''}
    ${tab==='gl'?`<div class="gl glass">${window.ISO_GLOSSARY.map(([w,d])=>`<div><b>${esc(w)}</b><p>${esc(d)}</p></div>`).join('')}</div>`:''}
    ${tab==='el'?`<div class="gl glass">${window.ISO_ELECTION.map(([w,d])=>`<div><b>${esc(w)}</b><p>${esc(d)}</p></div>`).join('')}</div>
      <a class="btn accent" href="https://www.service-public.fr/particuliers/vosdroits/R51788" target="_blank" rel="noopener">Vérifier mon inscription</a>`:''}
  `);
  view.querySelectorAll('[data-lt]').forEach(b=>b.onclick=()=>{haptic();learn(b.dataset.lt)});
  view.querySelectorAll('[data-prog]').forEach(b=>b.onclick=()=>progPage(b.dataset.prog,'s'));
}
function progPage(id,mode){
  nav('main','learn');
  const c=byId[id],p=window.ISO_PROGS[id];
  go(`
    <button class="linkbtn" id="bk" style="align-self:flex-start">Tous les partis</button>
    <div class="stack" style="gap:8px"><span class="fam" style="align-self:flex-start">${esc(famById[c.fam].name)}</span><h2>${esc(c.party)}</h2><p class="small">Candidat${['na','mt','mlp'].includes(id)?'e':''} : <strong>${esc(c.name)}</strong>. ${esc(p.intro)}</p></div>
    <div class="seg glass" role="tablist" style="grid-template-columns:1fr 1fr">
      <button role="tab" aria-selected="${mode==='s'}" data-m="s">Simplifiée</button>
      <button role="tab" aria-selected="${mode==='d'}" data-m="d">Classique</button>
    </div>
    ${Object.keys(T).map(t=>{const x=p.t[t];const empty=!x.d.length;return`<section class="theme-sec glass"><span class="tag">${esc(T[t])}</span>
      ${mode==='s'||empty?`<p class="simple ${empty?'none':''}">${esc(x.s)}</p>`:`<ul class="bul">${x.d.map(m=>`<li>${esc(m)}</li>`).join('')}</ul>`}</section>`}).join('')}
    <p class="tiny" style="padding:0 6px">« (2022) » signale une mesure d'un ancien programme pas encore mise à jour. Résumé fait à partir de sources publiques, à jour au ${window.ISO_UPDATED}.</p>
    <div class="stack">
      ${p.site?`<a class="btn accent" href="${p.site[1]}" target="_blank" rel="noopener">${esc(p.site[0])}</a>`:`<p class="note glass">Pas encore de programme complet publié en ligne.</p>`}
      ${p.src?`<a class="btn glass" href="${p.src[1]}" target="_blank" rel="noopener">${esc(p.src[0])}</a>`:`<a class="btn glass" href="https://barometre-2027.fr/programmes/${slug(c.name)}" target="_blank" rel="noopener">Toutes les sources, mesure par mesure</a>`}
      <button class="btn glass" id="cmp">Le comparer à un autre candidat</button>
    </div>
  `);
  document.getElementById('bk').onclick=()=>learn('cand');
  view.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{haptic();progPage(id,b.dataset.m)});
  document.getElementById('cmp').onclick=()=>compare(id,id==='jlm'?'mlp':'jlm');
}

/* ----- Navigation ----- */
view.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(!g)return;const k=g.dataset.go;
  if(k==='express'||k==='full'||k==='theme')priorities(k);
  else if(k==='resume'){state=store.get('progress');if(state)card();else home()}
  else if(k==='blind')blind();else if(k==='compare')compare();else if(k==='method')method();else if(k==='home')home();
  else if(k==='last'){const l=store.get('last');if(l)results(l)}});
document.getElementById('home-btn').onclick=home;
document.getElementById('info-btn').onclick=info;
{const d=daysLeft();if(d>0)document.getElementById('info-btn').textContent='J-'+d;}
readHash();home();
if('serviceWorker' in navigator&&isPages){
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
  let reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloaded)return;reloaded=true;location.reload()});
}
})();
